name: cyclone
hazard:
  formula: "min(1.0, wind_kmh / 250.0)"        # §3.1 max sustained wind
  inputs: [wind_kmh]
  tau_survivability_hours: 12                  # §6.1 exposure
physics:                                       # §3.2 Holland: P(r) = Pc + (Pn-Pc)*exp(-(Rm/r)^B)
  model: holland
  fields: [central_pressure_hpa, max_wind_knots, rmw_km, sst_celsius]
  notes: "sst_celsius > 26.5 fuels intensification"
uncertainty:
  tau_data_hours: 6.0
models:
  primary: holland_plus_gbdt
grid:
  cell_size_m: 1000                            # §1.2 regional

dataset:
  kaggle: rajumavinmar/cyclone-dataset
  columns:
    wind_kmh: [wind_kmh, max_wind, wind_speed, wind, maximum sustained wind, usa_wind, wmo_wind]
    lat: [latitude, lat, y]
    lon: [longitude, lon, long, x]
    pressure_hpa: [pressure, central_pressure, wmo_pres, usa_pres, mslp]
    name: [name, cyclone_name, storm]
    date: [date, iso_time, time, season, year]
