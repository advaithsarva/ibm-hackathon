name: drought
hazard:
  formula: "1.0 - smi"                         # §3.1 soil moisture index, normalized
  inputs: [smi]
  # tau_survivability_hours: not specified in spec §6.1 — do not invent one
physics:                                       # §3.2 VCI = 100*(NDVI - NDVI_min)/(NDVI_max - NDVI_min)
  model: vci
  fields: [nir_band, red_band, soil_moisture_anomaly, evapotranspiration]
  notes: "VCI < 35% = severe vegetation stress"
uncertainty:
  tau_data_hours: 12.0
models:
  primary: statistical_vci_plus_gradient_boosting
grid:
  cell_size_m: 1000                            # §1.2 regional

dataset:
  kaggle: kevinmathewsgeorge/india-drought-analysis-data-2000-2023
  columns:
    smi: [smi, soil_moisture_index, soil_moisture, moisture_index, spi, ndvi]
    lat: [latitude, lat, y]
    lon: [longitude, lon, long, x]
    district: [district, dist, region, state]
    date: [date, year, month, time]
